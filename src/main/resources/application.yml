spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:7433/aws-refresh}
    username: ${JDBC_DATABASE_USERNAME:psqladmin}
    password: ${JDBC_DATABASE_PASSWORD:psqladminpas$}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
batch:
  job:
    scheduler-pool-size: 10
    executor-pool-size: 5
    executor-queue-capacity: 100
    max-retry-attempts: 3
    retry-delay-millis: 5000
    job-timeout-minutes: 60
    enable-scheduling: true
    scheduler-refresh-interval-minutes: 5
