<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <title>[[#{emailTemplate.add.headline}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="d-flex flex-wrap mb-4">
                <h1 class="flex-grow-1">[[#{emailTemplate.add.headline}]]</h1>
                <div>
                    <a th:href="@{/emailTemplates}" class="btn btn-secondary">[[#{emailTemplate.add.back}]]</a>
                </div>
            </div>
            <div th:replace="~{fragments/forms::globalErrors('emailTemplate')}" />
            <form th:action="${requestUri}" method="post" novalidate="">
                <div th:replace="~{fragments/forms::inputRow(object='emailTemplate', field='code', required=true)}" />
                <div th:replace="~{fragments/forms::inputRow(object='emailTemplate', field='subjectTemplate', required=true, type='textarea')}" />
                <div th:replace="~{fragments/forms::inputRow(object='emailTemplate', field='bodyTemplate', required=true, type='textarea')}" />
                <div th:replace="~{fragments/forms::inputRow(object='emailTemplate', field='isActive', type='checkbox')}" />
                <div th:replace="~{fragments/forms::inputRow(object='emailTemplate', field='createdAt', required=true)}" />
                <div th:replace="~{fragments/forms::inputRow(object='emailTemplate', field='updatedAt', required=true)}" />
                <input type="submit" th:value="#{emailTemplate.add.headline}" class="btn btn-primary mt-4" />
            </form>
        </div>
    </body>
</html>
