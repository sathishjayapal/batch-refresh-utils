spring:
  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

batch:
  job:
    scheduler-pool-size: 20
    executor-pool-size: 10
    executor-queue-capacity: 200
    max-retry-attempts: 3
    retry-delay-millis: 5000
    job-timeout-minutes: 120
    enable-scheduling: true
    scheduler-refresh-interval-minutes: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: WARN
    me.sathish.aws_refresh: INFO
    me.sathish.aws_refresh.service.BatchJobSchedulerService: INFO
  file:
    name: /var/log/batch-refresh/application.log
